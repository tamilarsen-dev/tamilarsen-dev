name: contributions

on:
  schedule:
    - cron: "17 0 * * *" # 07:17 in Jakarta
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/contributions.yml"]

permissions:
  contents: write

concurrency:
  group: contributions
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Draw the cards
        run: node scripts/contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git add assets/contributions-*.svg
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: redraw contributions card"
          git push
